[package]
name = "rust-ffi"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
libc = "0.2"
sha2 = "0.10"

[build-dependencies]
cc = "1"

[[bin]]
name = "rust-ffi"
path = "src/main.rs"

[[bin]]
name = "bench-state-transition"
path = "src/bin/bench-state-transition.rs"

[[bin]]
name = "bench-state-transition-realism"
path = "src/bin/bench-state-transition-realism.rs"

[[bin]]
name = "bench-fork-choice"
path = "src/bin/bench-fork-choice.rs"

[[bin]]
name = "bench-ffi-overhead"
path = "src/bin/bench-ffi-overhead.rs"

[[bin]]
name = "bench-ffi-marshal"
path = "src/bin/bench-ffi-marshal.rs"

[[bin]]
name = "bench-ffi-ssz"
path = "src/bin/bench-ffi-ssz.rs"

[profile.release]
debug = true
lto = "thin"
codegen-units = 1
